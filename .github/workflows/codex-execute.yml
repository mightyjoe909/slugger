name: Slugger Codex Target Adapter

on:
  workflow_call:
    inputs:
      execution_input_json:
        description: Complete canonical execution-input/v2 JSON object
        required: true
        type: string
      concurrency_group:
        description: Router-supplied transport concurrency identity
        required: true
        type: string
    secrets:
      CODEX_API_KEY:
        required: false
      SLUGGER_PUBLICATION_TOKEN:
        required: false
      CODEX_RESULT_TOKEN:
        required: true

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.admit.outputs.mode }}
      admitted: ${{ steps.admit.outputs.admitted }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: Young-Consultations/slugger
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -c constraints-ci.txt -e .
      - id: admit
        name: Authenticate caller and validate canonical request
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
          CONCURRENCY_GROUP: ${{ inputs.concurrency_group }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$EXECUTION_INPUT_JSON" > "$RUNNER_TEMP/execution-input.json"
          python -m mvp.target_adapter.cli --input "$RUNNER_TEMP/execution-input.json" \
            --concurrency-group "$CONCURRENCY_GROUP" --caller-repository "$CALLER_REPOSITORY" \
            --output "$RUNNER_TEMP/admitted.json"
          echo "mode=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["mode"])' "$RUNNER_TEMP/admitted.json")" >> "$GITHUB_OUTPUT"
          echo "admitted=$(cat "$RUNNER_TEMP/admitted.json")" >> "$GITHUB_OUTPUT"

  verify:
    needs: admit
    if: ${{ needs.admit.outputs.mode == 'verify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      execution_result: ${{ steps.verify.outputs.execution_result }}
      source_issue: ${{ steps.verify.outputs.source_issue }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: Young-Consultations/slugger
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -c constraints-ci.txt -e .
      - id: verify
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
          ADMITTED_JSON: ${{ needs.admit.outputs.admitted }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail; umask 077
          printf '%s' "$EXECUTION_INPUT_JSON" > "$RUNNER_TEMP/execution-input.json"
          printf '%s' "$ADMITTED_JSON" > "$RUNNER_TEMP/admitted.json"
          python -m mvp.target_adapter.workflow_run --verify-only --input "$RUNNER_TEMP/execution-input.json" \
            --admission "$RUNNER_TEMP/admitted.json" --github-output "$GITHUB_OUTPUT"

  implement:
    needs: admit
    if: ${{ needs.admit.outputs.mode == 'implement' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      execution_result: ${{ steps.implement.outputs.execution_result }}
      source_issue: ${{ steps.implement.outputs.source_issue }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: Young-Consultations/slugger
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: pip install -c constraints-ci.txt -e ".[test]"
      - run: npm install --global @openai/codex
      - id: implement
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
          ADMITTED_JSON: ${{ needs.admit.outputs.admitted }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          SLUGGER_PUBLICATION_TOKEN: ${{ secrets.SLUGGER_PUBLICATION_TOKEN }}
        run: |
          set -euo pipefail; umask 077
          printf '%s' "$EXECUTION_INPUT_JSON" > "$RUNNER_TEMP/execution-input.json"
          printf '%s' "$ADMITTED_JSON" > "$RUNNER_TEMP/admitted.json"
          python -m mvp.target_adapter.workflow_run --input "$RUNNER_TEMP/execution-input.json" \
            --admission "$RUNNER_TEMP/admitted.json" --github-output "$GITHUB_OUTPUT"

  result-verify:
    needs: verify
    if: ${{ always() && needs.verify.outputs.execution_result != '' }}
    uses: Young-Consultations/.github/.github/workflows/codex-result-receiver.yml@c6090e5bbadcc2102a1cb91875466e9decdada1e
    with:
      execution_result: ${{ needs.verify.outputs.execution_result }}
      source_issue: ${{ needs.verify.outputs.source_issue }}
    secrets:
      CODEX_RESULT_TOKEN: ${{ secrets.CODEX_RESULT_TOKEN }}

  result-implement:
    needs: implement
    if: ${{ always() && needs.implement.outputs.execution_result != '' }}
    uses: Young-Consultations/.github/.github/workflows/codex-result-receiver.yml@c6090e5bbadcc2102a1cb91875466e9decdada1e
    with:
      execution_result: ${{ needs.implement.outputs.execution_result }}
      source_issue: ${{ needs.implement.outputs.source_issue }}
    secrets:
      CODEX_RESULT_TOKEN: ${{ secrets.CODEX_RESULT_TOKEN }}
