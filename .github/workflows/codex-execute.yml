name: Slugger Codex Target Adapter (disabled)

on:
  workflow_call:
    inputs:
      execution_input_json:
        description: Complete canonical execution-input/v2 JSON object
        required: true
        type: string
      concurrency_group:
        description: Router-supplied transport concurrency identity
        required: true
        type: string

concurrency:
  group: ${{ inputs.concurrency_group }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  disabled:
    name: Reject while the organization target is disabled
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed before checkout, Codex, or publication
        env:
          EXECUTION_INPUT_JSON: ${{ inputs.execution_input_json }}
        run: |
          set -euo pipefail
          test -n "$EXECUTION_INPUT_JSON"
          echo "Slugger's organization target is disabled and its next-MVP adapter is not implemented." >&2
          exit 1
