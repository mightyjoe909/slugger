name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints-ci.txt -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy mvp cli

  test:
    name: Blueprint regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints-ci.txt -e ".[test]"
      - name: Run recovery regression tests
        run: |
          python -m pytest \
            tests/test_next_mvp_convergence.py \
            tests/test_workflow_contract.py \
            tests/test_conformance.py \
            -q
      - name: Validate canonical target contract
        run: python scripts/test_codex_execute_contract.py
      - name: Regenerate complete shared-oracle evidence
        run: |
          python scripts/run_tc_mvp_ci_001.py
          git diff --exit-code -- .ai-sdlc/conformance/tc-mvp-ci-001.json
      - run: git diff --check

  package-verification:
    name: Package verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints-ci.txt -e ".[test]"
      - run: python -m build
      - name: Install wheel and verify package metadata
        run: |
          python -m venv clean-wheel-venv
          . clean-wheel-venv/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -m pip show slugger

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - run: |
          "$(go env GOPATH)/bin/actionlint" -shellcheck=
      - name: Shell syntax validation
        run: |
          find scripts tests -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
