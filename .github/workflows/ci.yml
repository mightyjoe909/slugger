name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints-ci.txt -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m mypy mvp cli

  test:
    name: Blueprint regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints-ci.txt -e ".[test]"
      - run: python -m pytest tests/test_next_mvp_convergence.py -q

  package-verification:
    name: Package verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-ci.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints-ci.txt -e ".[test]"
      - run: python -m build
      - name: Install wheel and verify package metadata
        run: |
          python -m venv clean-wheel-venv
          . clean-wheel-venv/bin/activate
          python -m pip install --upgrade pip
          pip install dist/*.whl
          python -m pip show slugger
